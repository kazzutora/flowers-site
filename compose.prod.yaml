name: flowers

# Production stack. The image is built by CI and pulled here by tag, so a
# rollback is one variable and one `up -d` (see deploy/README.md).

x-app: &app
  image: ${IMAGE:-ghcr.io/OWNER/flowers:latest}
  env_file: [.env]
  volumes:
    - media_public:/app/media/public
    - media_private:/app/media/private
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    image: postgres:16-alpine
    env_file: [.env]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowers}
      POSTGRES_USER: ${POSTGRES_USER:-flowers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowers}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    <<: *app
    command:
      - gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=3
      - --timeout=60
      # Long enough for a HEIC upload, short enough to notice a hung worker.
      - --graceful-timeout=30
      - --access-logfile=-
      - --error-logfile=-
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  celery:
    <<: *app
    command: ["celery", "-A", "config.celery", "worker", "-l", "info", "-Q", "default,media"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config.celery inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-beat:
    <<: *app
    command:
      - celery
      - -A
      - config.celery
      - beat
      - -l
      - info
      - --schedule
      - /tmp/celerybeat-schedule

  nginx:
    image: nginx:1.27-alpine
    depends_on: [web]
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Read only, and only the public volume: the private one is not mounted
      # here at all, so nginx could not serve an original even by mistake.
      - media_public:/srv/media-public:ro
      - static_files:/srv/static:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Runs once per deploy: copies the collected static files into the volume
  # nginx reads. Exits immediately afterwards.
  collectstatic:
    <<: *app
    command: ["python", "manage.py", "collectstatic", "--noinput"]
    volumes:
      - media_public:/app/media/public
      - media_private:/app/media/private
      - static_files:/app/staticfiles
    restart: "no"
    healthcheck:
      disable: true

volumes:
  postgres_data:
  redis_data:
  media_public:
  media_private:
  static_files:
