# Front door. TLS is terminated by Cloudflare, so this listens on plain HTTP
# behind it and trusts the forwarded protocol header Django is configured for.
#
# The private media volume is not mounted into this container at all. There is
# no location block for it below, and there is no path it could serve it from.

upstream django {
    server web:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    # A HEIC from a phone is the biggest thing that ever arrives here.
    client_max_body_size 25m;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Renditions carry their version in the file name (section 4.6), which is
    # the only reason `immutable` is safe here: a rebuild produces a new name.
    location /media/renditions/ {
        alias /srv/media-public/renditions/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /media/ {
        alias /srv/media-public/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # Hashed by collectstatic on a future storage backend; a month is safe now.
    location /static/ {
        alias /srv/static/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location = /healthz/ {
        access_log off;
        proxy_pass http://django;
    }

    location / {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Cloudflare hands us the visitor's address; the antispam layer hashes
        # it and never stores the address itself (section 15).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
