name: Deploy

# Merging into main puts the change on the test server without a manual step.
# The gate in ci.yml has already run on the pull request; it runs again here so
# nothing reaches the server on a red build.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "image=${IMAGE,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Ship it
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          # The script pulls, migrates to completion, and only then restarts.
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch --prune origin
            git checkout --force ${{ github.sha }}
            ./deploy/deploy.sh ${{ needs.build.outputs.image }}

      - name: Smoke the live site
        run: ./deploy/smoke.sh "${{ secrets.SITE_URL }}"
