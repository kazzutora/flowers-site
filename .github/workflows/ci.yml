name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flowers
          POSTGRES_USER: flowers
          POSTGRES_PASSWORD: flowers
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowers"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # Environment variables win over .env, so the gate runs on real services
      # without a secret. Telegram and Turnstile stay disabled: fakes answer.
      SECRET_KEY: ci-insecure-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost, 127.0.0.1
      SITE_URL: http://localhost:8000
      DATABASE_URL: postgresql://flowers:flowers@localhost:5432/flowers
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      IP_HASH_SALT: ci-insecure-salt
      DJANGO_SETTINGS_MODULE: config.settings

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      # Without it the end to end scenarios skip themselves instead of running.
      - name: Install the browser
        run: playwright install --with-deps chromium

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy .

      - name: Migrations are in sync with the models
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest --cov=apps --cov=clients --cov-report=term-missing --cov-fail-under=70

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
