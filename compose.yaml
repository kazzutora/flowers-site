name: flowers

x-app: &app
  build:
    context: .
    target: dev
  env_file: [.env]
  volumes:
    - .:/app
    - media_public:/app/media/public
    - media_private:/app/media/private
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowers
      POSTGRES_USER: flowers
      POSTGRES_PASSWORD: flowers
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowers -d flowers"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    <<: *app
    command: >
      sh -c "django-admin compilemessages &&
             python manage.py migrate --noinput &&
             tailwindcss -i static/css/input.css -o static/css/app.css &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  celery:
    <<: *app
    command: ["celery", "-A", "config.celery", "worker", "-l", "info", "-Q", "default,media"]

  celery-beat:
    <<: *app
    command:
      [
        "celery",
        "-A",
        "config.celery",
        "beat",
        "-l",
        "info",
        "--schedule",
        "/tmp/celerybeat-schedule",
      ]

volumes:
  postgres_data:
  redis_data:
  media_public:
  media_private:
