[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flowers"
version = "0.1.0"
description = "Flower studio showcase site"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1,<6.0",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "celery[redis]>=5.4",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "Pillow>=10.4",
    "pillow-avif-plugin>=1.4",
    "pillow-heif>=0.18",
    "django-storages[s3]>=1.14",
    "django-unfold>=0.40",
    "django-admin-sortable2>=2.2",
    "django-phonenumber-field[phonenumbers]>=8.0",
    "django-tinymce>=4.1",
    "bleach>=6.1",
    "gunicorn>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "factory-boy>=3.3",
    "playwright>=1.47",
    "pytest-playwright>=0.5",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.0",
]

# The project ships no importable package: `pip install .` installs the dependency
# set only, and the source tree is used from /app.
[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py312"
# Markdown is excluded on purpose: ruff reformats fenced python blocks, and
# tech.md is a frozen contract.
extend-exclude = ["*/migrations/*", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DJ", "T20", "RUF"]
ignore = [
    "RUF012", # Django class attributes are not immutable by convention
    # The project is bilingual: Cyrillic inside string literals is content,
    # not a homoglyph attack.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"] # the seed script reports progress on stdout

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
exclude = ["/migrations/", "\\.venv"]

# Strict where the logic lives; templates, admin and views stay pragmatic.
[[tool.mypy.overrides]]
module = [
    "apps.*.services.*",
    "apps.*.contracts",
    "apps.*.filters",
    "apps.*.seo",
    "clients.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_return_any = true
strict_equality = true
no_implicit_optional = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
python_files = ["test_*.py"]
testpaths = ["apps", "clients", "tests"]
markers = ["e2e: drives a real browser through Playwright"]
DJANGO_SETTINGS_MODULE = "config.settings"
