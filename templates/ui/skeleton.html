{% comment %}
Skeleton — tech.md §8
Params: kind (card|line|image, default line)
{% endcomment %}
{% with kind=kind|default:"line" %}
{% if kind == "card" %}
<div class="animate-pulse rounded-token-lg border border-ink-200 bg-white p-3">
  <div class="aspect-square rounded-token bg-ink-100"></div>
  <div class="mt-3 h-3 w-3/4 rounded bg-ink-100"></div>
  <div class="mt-2 h-3 w-1/2 rounded bg-ink-100"></div>
</div>
{% elif kind == "image" %}
<div class="aspect-video w-full animate-pulse rounded-token-lg bg-ink-100"></div>
{% else %}
<div class="h-3 w-full animate-pulse rounded bg-ink-100"></div>
{% endif %}
{% endwith %}
