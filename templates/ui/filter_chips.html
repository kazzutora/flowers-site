{% comment %}
FilterChips — tech.md §8
Params: groups (list of {key, label, options: [{value, label, active}]}), active, hx_target
{% endcomment %}
<div class="flex flex-col gap-4">
  {% for group in groups %}
  <div>
    <p class="mb-2 text-xs font-semibold uppercase tracking-wide text-ink-400">{{ group.label }}</p>
    <div class="flex flex-wrap gap-2">
      {% for option in group.options %}
      <button
        type="button"
        {% if hx_target %}hx-get="?{{ group.key }}={{ option.value }}" hx-target="{{ hx_target }}" hx-swap="outerHTML"{% endif %}
        class="rounded-full border px-3 py-1.5 text-sm font-medium transition-colors
          {% if option.active %}border-brand-600 bg-brand-600 text-white{% else %}border-ink-200 bg-white text-ink-700 hover:border-brand-300{% endif %}"
      >
        {{ option.label }}
      </button>
      {% endfor %}
    </div>
  </div>
  {% endfor %}
</div>
