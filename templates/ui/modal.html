{% comment %}
Modal — tech.md §8
Params: id, title, body_slot (safe HTML — build with {% capture as %}), size (sm|md|lg, default md)
Open from anywhere with: @click="$dispatch('open-modal-{{ id }}')" (window event)
{% endcomment %}
<div
  x-data="{ open: false }"
  x-on:open-modal-{{ id }}.window="open = true"
  x-on:keydown.escape.window="open = false"
  x-show="open"
  x-cloak
  class="fixed inset-0 z-50 flex items-center justify-center p-4"
  role="dialog"
  aria-modal="true"
  aria-labelledby="{{ id }}-title"
>
  <div class="fixed inset-0 bg-ink-950/50" @click="open = false"></div>
  <div
    x-show="open"
    x-transition
    class="relative w-full rounded-token-xl bg-white p-6 shadow-card-hover {% if size == 'sm' %}max-w-sm{% elif size == 'lg' %}max-w-2xl{% else %}max-w-md{% endif %}"
  >
    <div class="mb-4 flex items-start justify-between gap-4">
      <h2 id="{{ id }}-title" class="text-lg font-semibold text-ink-900">{{ title }}</h2>
      <button type="button" class="text-ink-400 hover:text-ink-700" @click="open = false" aria-label="Закрити">✕</button>
    </div>
    <div>{{ body_slot }}</div>
  </div>
</div>
