{% load static i18n %}{% comment %}
Parameters: id, title, body_template or body.
Opening one is `$dispatch('modal-open', '<id>')`.
{% endcomment %}<div x-data="{ open: false }" x-cloak
     @modal-open.window="if ($event.detail === '{{ id }}') open = true"
     @keydown.escape.window="open = false"
     x-effect="document.body.classList.toggle('is-locked', open)">
  <div x-show="open" x-transition.opacity class="fixed inset-0 z-40 bg-ink/40" @click="open = false"></div>
  <div x-show="open" x-transition role="dialog" aria-modal="true" aria-labelledby="modal-title-{{ id }}"
       class="fixed inset-x-4 top-1/2 z-50 mx-auto max-h-drawer w-auto max-w-lg -translate-y-1/2 overflow-y-auto
              rounded-lg bg-cream p-5 shadow-overlay md:inset-x-0">
    <div class="mb-4 flex items-start justify-between gap-4">
      <h2 id="modal-title-{{ id }}" class="text-2xl">{{ title }}</h2>
      <button type="button" @click="open = false" aria-label="{% trans 'Close' %}"
              class="inline-flex min-h-11 min-w-11 items-center justify-center rounded-full text-ink hover:bg-accentSoft">
        <svg class="h-6 w-6" aria-hidden="true"><use href="{% static 'img/icons.svg' %}#close"></use></svg>
      </button>
    </div>
    {% if body_template %}{% include body_template %}{% else %}{{ body }}{% endif %}
  </div>
</div>
