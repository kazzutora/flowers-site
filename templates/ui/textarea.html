{% comment %}
Parameters: name, label, value, error, required, hint, autocomplete, rows, maxlength, attrs.
{% endcomment %}<div class="space-y-1">
  <label for="id_{{ name }}" class="block text-sm font-medium text-ink">
    {{ label }}{% if required %} <span class="text-danger" aria-hidden="true">*</span>{% endif %}
  </label>
  <textarea id="id_{{ name }}" name="{{ name }}" rows="{{ rows|default:4 }}"
            {% if maxlength %}maxlength="{{ maxlength }}"{% endif %}
            {% if required %}required{% endif %}
            {% if autocomplete %}autocomplete="{{ autocomplete }}"{% endif %}
            {% if error %}aria-invalid="true" aria-describedby="err_{{ name }}"{% elif hint %}aria-describedby="hint_{{ name }}"{% endif %}
            class="w-full rounded-md border bg-white px-4 py-3 text-base text-ink placeholder:text-muted
                   {% if error %}border-danger{% else %}border-line{% endif %}"
            {{ attrs|safe }}>{{ value|default:'' }}</textarea>
  {% if hint and not error %}<p id="hint_{{ name }}" class="text-sm text-muted">{{ hint }}</p>{% endif %}
  {% if error %}<p id="err_{{ name }}" class="text-sm text-danger">{{ error }}</p>{% endif %}
</div>
