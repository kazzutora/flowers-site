{% load static %}{% comment %}
Parameters: icon, label (used as aria-label), href, variant (plain|solid|outline), attrs.
{% endcomment %}{% if href %}
<a href="{{ href }}" aria-label="{{ label }}" title="{{ label }}"
   class="inline-flex min-h-11 min-w-11 items-center justify-center rounded-full transition
          {% if variant == 'solid' %}bg-accent text-white hover:opacity-90
          {% elif variant == 'outline' %}border border-line bg-white text-ink hover:bg-accentSoft
          {% else %}text-ink hover:bg-accentSoft{% endif %}"
   {{ attrs|safe }}>
  <svg class="h-6 w-6" aria-hidden="true"><use href="{% static 'img/icons.svg' %}#{{ icon }}"></use></svg>
</a>
{% else %}
<button type="button" aria-label="{{ label }}" title="{{ label }}"{% if disabled %} disabled{% endif %}
   class="inline-flex min-h-11 min-w-11 items-center justify-center rounded-full transition
          disabled:cursor-not-allowed disabled:opacity-50
          {% if variant == 'solid' %}bg-accent text-white hover:opacity-90
          {% elif variant == 'outline' %}border border-line bg-white text-ink hover:bg-accentSoft
          {% else %}text-ink hover:bg-accentSoft{% endif %}"
   {{ attrs|safe }}>
  <svg class="h-6 w-6" aria-hidden="true"><use href="{% static 'img/icons.svg' %}#{{ icon }}"></use></svg>
</button>
{% endif %}
