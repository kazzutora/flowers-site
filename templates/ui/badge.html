{% comment %}
Badge — tech.md §8
Params: text, tone (neutral|success|warning|danger, default neutral)
{% endcomment %}
{% with tone=tone|default:"neutral" %}
<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium
  {% if tone == 'success' %}bg-success-50 text-success-700
  {% elif tone == 'warning' %}bg-warning-50 text-warning-700
  {% elif tone == 'danger' %}bg-danger-50 text-danger-700
  {% else %}bg-ink-100 text-ink-700{% endif %}">
  {{ text }}
</span>
{% endwith %}
