{% comment %}
Input — tech.md §8
Params: name, label, type (default text), value, error, required, placeholder, autocomplete
{% endcomment %}
<div class="flex flex-col gap-1.5">
  {% if label %}
  <label for="id_{{ name }}" class="text-sm font-medium text-ink-700">
    {{ label }}{% if required %} <span class="text-danger-600">*</span>{% endif %}
  </label>
  {% endif %}
  <input
    id="id_{{ name }}"
    name="{{ name }}"
    type="{{ type|default:"text" }}"
    value="{{ value|default:"" }}"
    {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}
    {% if autocomplete %}autocomplete="{{ autocomplete }}"{% endif %}
    {% if required %}required{% endif %}
    {% if error %}aria-invalid="true" aria-describedby="id_{{ name }}_error"{% endif %}
    class="h-11 rounded-token border bg-white px-3 text-sm text-ink-900 placeholder:text-ink-400 focus:outline-none focus:ring-2 focus:ring-brand-600
      {% if error %}border-danger-500{% else %}border-ink-200{% endif %}"
  >
  {% if error %}
  <p id="id_{{ name }}_error" class="text-sm text-danger-600">{{ error }}</p>
  {% endif %}
</div>
