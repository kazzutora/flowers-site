{% comment %}
Select — tech.md §8
Params: name, options (list of {value, label}), value, label, error
{% endcomment %}
<div class="flex flex-col gap-1.5">
  {% if label %}
  <label for="id_{{ name }}" class="text-sm font-medium text-ink-700">{{ label }}</label>
  {% endif %}
  <select
    id="id_{{ name }}"
    name="{{ name }}"
    {% if error %}aria-invalid="true" aria-describedby="id_{{ name }}_error"{% endif %}
    class="h-11 rounded-token border bg-white px-3 text-sm text-ink-900 focus:outline-none focus:ring-2 focus:ring-brand-600
      {% if error %}border-danger-500{% else %}border-ink-200{% endif %}"
  >
    {% for option in options %}
    <option value="{{ option.value }}" {% if option.value == value %}selected{% endif %}>{{ option.label }}</option>
    {% endfor %}
  </select>
  {% if error %}
  <p id="id_{{ name }}_error" class="text-sm text-danger-600">{{ error }}</p>
  {% endif %}
</div>
