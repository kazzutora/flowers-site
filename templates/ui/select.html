{% comment %}
Parameters: name, label, options (iterable of value/label pairs), value, error, attrs.
{% endcomment %}<div class="space-y-1">
  <label for="id_{{ name }}" class="block text-sm font-medium text-ink">{{ label }}</label>
  <select id="id_{{ name }}" name="{{ name }}"
          {% if error %}aria-invalid="true" aria-describedby="err_{{ name }}"{% endif %}
          class="min-h-12 w-full rounded-md border bg-white px-4 text-base text-ink
                 {% if error %}border-danger{% else %}border-line{% endif %}"
          {{ attrs|safe }}>
    {% for option in options %}
      <option value="{{ option.0 }}"{% if option.0|stringformat:"s" == value|stringformat:"s" %} selected{% endif %}>{{ option.1 }}</option>
    {% endfor %}
  </select>
  {% if error %}<p id="err_{{ name }}" class="text-sm text-danger">{{ error }}</p>{% endif %}
</div>
