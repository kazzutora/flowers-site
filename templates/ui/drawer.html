{% comment %}
Drawer — tech.md §8. Mobile filters and cart.
Params: id, side (left|right, default right), title, body_slot (safe HTML)
Open from anywhere with: @click="$dispatch('open-drawer-{{ id }}')" (window event)
{% endcomment %}
<div
  x-data="{ open: false }"
  x-on:open-drawer-{{ id }}.window="open = true"
  x-on:keydown.escape.window="open = false"
  x-show="open"
  x-cloak
  class="fixed inset-0 z-50"
  role="dialog"
  aria-modal="true"
  aria-labelledby="{{ id }}-title"
>
  <div class="fixed inset-0 bg-ink-950/50" @click="open = false"></div>
  <div
    x-show="open"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="{% if side == 'left' %}-translate-x-full{% else %}translate-x-full{% endif %}"
    x-transition:enter-end="translate-x-0"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="translate-x-0"
    x-transition:leave-end="{% if side == 'left' %}-translate-x-full{% else %}translate-x-full{% endif %}"
    class="fixed inset-y-0 flex w-full max-w-sm flex-col bg-white shadow-card-hover {% if side == 'left' %}left-0{% else %}right-0{% endif %}"
  >
    <div class="flex items-center justify-between border-b border-ink-200 px-4 py-3">
      <p id="{{ id }}-title" class="text-base font-semibold text-ink-900">{{ title }}</p>
      <button type="button" class="text-ink-400 hover:text-ink-700" @click="open = false" aria-label="Закрити">✕</button>
    </div>
    <div class="flex-1 overflow-y-auto px-4 py-4">{{ body_slot }}</div>
  </div>
</div>
