x-app: &app
  build:
    context: .
    target: dev
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.local
  volumes:
    - .:/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowers}
      POSTGRES_USER: ${POSTGRES_USER:-flowers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host port is overridable: the app talks to postgres over the compose
      # network by service name, so publishing is only for local clients. On a
      # machine that already runs Postgres, set POSTGRES_HOST_PORT to free 5432.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowers}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP

  web:
    <<: *app
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--reload", "--workers", "2"]
    ports:
      - "8000:8000"

  celery-default:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-Q", "default", "-l", "info", "--concurrency=2"]

  celery-notifications:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-Q", "notifications", "-l", "info", "--concurrency=2"]

  celery-payments:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-Q", "payments", "-l", "info", "--concurrency=2"]

  celery-media:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-Q", "media", "-l", "info", "--concurrency=2"]

  celery-beat:
    <<: *app
    command:
      [
        "celery",
        "-A",
        "config",
        "beat",
        "-l",
        "info",
        "--scheduler",
        "django_celery_beat.schedulers:DatabaseScheduler",
      ]

volumes:
  postgres_data:
  redis_data:
